<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" role="img" aria-labelledby="title desc"><title id="title">FluxBank architecture, mobile view</title><desc id="desc">REST API and banking modules commit to PostgreSQL and Outbox. The Outbox worker publishes to Kafka and the History consumer records events. API, worker and consumer are in the same application.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5eead4"/></marker></defs><rect width="360" height="920" rx="12" fill="#0d1117"/><g font-family="Arial,Helvetica,sans-serif"><rect x="20" y="20" width="320" height="86" rx="10" fill="#172638" stroke="#405369"/><text x="36" y="53" fill="#e6edf3" font-size="18" font-weight="700">Client</text><text x="36" y="80" fill="#9db0c5" font-size="14">HTTP requests with JWT</text><rect x="20" y="160" width="320" height="86" rx="10" fill="#172638" stroke="#405369"/><text x="36" y="193" fill="#e6edf3" font-size="18" font-weight="700">REST API + Banking modules</text><text x="36" y="220" fill="#9db0c5" font-size="14">Inside the FluxBank application</text><rect x="20" y="310" width="320" height="86" rx="10" fill="#172638" stroke="#405369"/><text x="36" y="343" fill="#e6edf3" font-size="18" font-weight="700">PostgreSQL + Outbox</text><text x="36" y="370" fill="#9db0c5" font-size="14">Financial state and durable events</text><rect x="20" y="460" width="320" height="86" rx="10" fill="#172638" stroke="#405369"/><text x="36" y="493" fill="#e6edf3" font-size="18" font-weight="700">Outbox worker</text><text x="36" y="520" fill="#9db0c5" font-size="14">Inside FluxBank · claim and publish</text><rect x="20" y="610" width="320" height="86" rx="10" fill="#172638" stroke="#405369"/><text x="36" y="643" fill="#e6edf3" font-size="18" font-weight="700">Apache Kafka</text><text x="36" y="670" fill="#9db0c5" font-size="14">Transfer-completed events</text><rect x="20" y="760" width="320" height="86" rx="10" fill="#172638" stroke="#405369"/><text x="36" y="793" fill="#e6edf3" font-size="18" font-weight="700">History consumer</text><text x="36" y="820" fill="#9db0c5" font-size="14">Inside FluxBank · idempotent records</text><path d="M180 106V160" stroke="#5eead4" stroke-width="2" marker-end="url(#a)"/><text x="193" y="138.0" fill="#9db0c5" font-size="13">request</text><path d="M180 246V310" stroke="#5eead4" stroke-width="2" marker-end="url(#a)"/><text x="193" y="283.0" fill="#9db0c5" font-size="13">commit</text><path d="M180 396V460" stroke="#5eead4" stroke-width="2" marker-end="url(#a)"/><text x="193" y="433.0" fill="#9db0c5" font-size="13">poll</text><path d="M180 546V610" stroke="#5eead4" stroke-width="2" marker-end="url(#a)"/><text x="193" y="583.0" fill="#9db0c5" font-size="13">publish</text><path d="M180 696V760" stroke="#5eead4" stroke-width="2" marker-end="url(#a)"/><text x="193" y="733.0" fill="#9db0c5" font-size="13">consume</text><text x="180" y="885" text-anchor="middle" fill="#9db0c5" font-size="13">History uses the same PostgreSQL database.</text></g></svg>