<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc"><title id="title">FluxBank system architecture</title><desc id="desc">One Spring Boot application contains the REST API, banking modules, Outbox worker and History consumer. Banking modules commit financial data and Outbox to PostgreSQL. The worker polls committed rows and publishes events to Kafka. The History consumer writes records to the same database.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#526579"/></marker><marker id="event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#007f80"/></marker></defs><rect width="800" height="650" rx="16" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="125" width="760" height="320" rx="14" fill="#f5f8fb" stroke="#bccbd8"/><text x="360" y="153" fill="#13263d" font-size="17" font-weight="700">FluxBank · modular monolith</text><rect x="50" y="30" width="260" height="70" rx="10" fill="#ffffff" stroke="#bccbd8" stroke-width="1.5"/><text x="68" y="59" fill="#13263d" font-size="19" font-weight="700">Client</text><text x="68" y="81" fill="#526579" font-size="14">REST requests with Bearer JWT</text><rect x="50" y="180" width="260" height="82" rx="10" fill="#ffffff" stroke="#bccbd8" stroke-width="1.5"/><text x="68" y="209" fill="#13263d" font-size="19" font-weight="700">REST API</text><text x="68" y="231" fill="#526579" font-size="14">Authentication and validation</text><rect x="450" y="180" width="280" height="102" rx="10" fill="#ffffff" stroke="#bccbd8" stroke-width="1.5"/><text x="468" y="209" fill="#13263d" font-size="19" font-weight="700">Banking modules</text><text x="468" y="231" fill="#526579" font-size="14">Accounts · beneficiaries</text><text x="468" y="249" fill="#526579" font-size="14">Internal / external transfers</text><rect x="450" y="330" width="280" height="70" rx="10" fill="#ffffff" stroke="#007f80" stroke-width="1.5"/><text x="468" y="359" fill="#13263d" font-size="19" font-weight="700">Outbox worker</text><text x="468" y="381" fill="#526579" font-size="14">Claim and publish completed events</text><rect x="50" y="330" width="260" height="70" rx="10" fill="#ffffff" stroke="#007f80" stroke-width="1.5"/><text x="68" y="359" fill="#13263d" font-size="19" font-weight="700">History consumer</text><text x="68" y="381" fill="#526579" font-size="14">Idempotent transaction records</text><rect x="450" y="525" width="280" height="80" rx="10" fill="#ffffff" stroke="#bccbd8" stroke-width="1.5"/><text x="468" y="554" fill="#13263d" font-size="19" font-weight="700">PostgreSQL 16</text><text x="468" y="576" fill="#526579" font-size="14">Financial state + Outbox</text><rect x="50" y="525" width="260" height="80" rx="10" fill="#ffffff" stroke="#007f80" stroke-width="1.5"/><text x="68" y="554" fill="#13263d" font-size="19" font-weight="700">Apache Kafka</text><text x="68" y="576" fill="#526579" font-size="14">Transfer-completed events</text><path d="M180 100V180" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="192" y="119" text-anchor="start" fill="#526579" font-size="13">HTTP</text><path d="M310 221H450" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="352" y="209" text-anchor="start" fill="#526579" font-size="13">call</text><path d="M730 231H765V565H730" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="755" y="310" text-anchor="end" fill="#526579" font-size="13">commit</text><path d="M590 525V400" fill="none" stroke="#007f80" stroke-width="2" stroke-linejoin="round" marker-end="url(#event)"/><text x="602" y="483" text-anchor="start" fill="#526579" font-size="13">poll committed rows</text><path d="M450 365H380V565H310" fill="none" stroke="#007f80" stroke-width="2" stroke-linejoin="round" marker-end="url(#event)"/><text x="390" y="470" text-anchor="start" fill="#526579" font-size="13">publish</text><path d="M180 525V400" fill="none" stroke="#007f80" stroke-width="2" stroke-linejoin="round" marker-end="url(#event)"/><text x="192" y="483" text-anchor="start" fill="#526579" font-size="13">consume</text><text x="400" y="635" text-anchor="middle" fill="#526579" font-size="13">History records use the same PostgreSQL database.</text></g></svg>