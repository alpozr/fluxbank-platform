spring:
  datasource:
    hikari:
      connection-init-sql: "SET statement_timeout TO '15s'"
  jpa:
    hibernate:
      ddl-auto: validate

outbox:
  polling:
    # Integration tests explicitly control claiming and processing transactions.
    enabled: false
  recovery:
    # Recovery tests explicitly control stale-event transitions.
    enabled: false

kafka:
  consumer:
    # Listener integration tests explicitly enable and start the consumer.
    enabled: false

security:
  jwt:
    # Test-only key so the application context does not require JWT_SECRET.
    secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
