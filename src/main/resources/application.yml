spring:
  application:
    name: fluxbank-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: fluxbank

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: fluxbank
    default-schema: fluxbank

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000