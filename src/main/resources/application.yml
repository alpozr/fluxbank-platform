spring:
  application:
    name: fluxbank-backend

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: fluxbank

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: fluxbank
    default-schema: fluxbank

kafka:
  topics:
    transfer-events: ${KAFKA_TRANSFER_EVENTS_TOPIC:fluxbank.transfer-events.v1}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000

payment-provider:
  base-url: ${PAYMENT_PROVIDER_BASE_URL:http://localhost:5001}
  settlement-account: ${PAYMENT_PROVIDER_SETTLEMENT_ACCOUNT:FLOAT-MAIN-001}
  recipient-account: ${PAYMENT_PROVIDER_RECIPIENT_ACCOUNT:EXT-CUST-001}
